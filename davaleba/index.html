 <div class="game">
        <h3>გამოიცანი რიცხვი</h3>

        <input type="number" id="guess" placeholder="0-100">
        <button onclick="checkGuess()">შემოწმება</button>

        <p id="result"></p>
    </div>
      </section>


 <script >

var answer = Math.floor(Math.random() * 101);

function checkGuess() {
    var userAnswer = Number(document.getElementById("guess").value);
    var result = document.getElementById("result");

    if (userAnswer == answer) {
        result.innerHTML = "გილოცავ, გამოიცანი!";
    } else if (userAnswer > answer) {
        result.innerHTML = "ნაკლები";
    } else {
        result.innerHTML = "მეტი";
    }
}
</script>
